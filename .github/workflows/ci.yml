name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build static export
        run: npm run build
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build production container with Docker Compose
        run: docker compose build frontend
      - name: Smoke test production container
        run: |
          docker compose up --detach --wait --wait-timeout 60 frontend
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/about/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/projects/daggler-website/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/health
      - name: Stop production container
        if: always()
        run: docker compose down --volumes
