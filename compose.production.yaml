name: daggler-website

services:
  frontend:
    image: "ghcr.io/ndbellew/daggler-website:${IMAGE_TAG:?IMAGE_TAG is required}"
    pull_policy: always
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:?SITE_ADDRESS is required}"
      WWW_SITE_ADDRESS: "${WWW_SITE_ADDRESS:-www.nathanbellew.com}"
      PRIMARY_SITE_URL: "${PRIMARY_SITE_URL:-https://nathanbellew.com}"
      BACKEND_UPSTREAM: "${BACKEND_UPSTREAM:-backend:3000}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  caddy_data:
  caddy_config:
